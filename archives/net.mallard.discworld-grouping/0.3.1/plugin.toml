id = "net.mallard.discworld-grouping"
name = "Discworld Grouping"
version = "0.3.1"
description = "A grouping panel showing group roster with HP/GP/shielding info."
language = "lua"
entry = "src/main.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.9.0"
authors = ["Wizard Quack"]
license = "MIT"

[permissions]
sends = true   # refresh button sends `gs` to the world
# char.info: subscribe for live updates of the player's capname (used
# to name the self row in the roster). "char.info.*" is for gmcp.get()
# at startup so we self-heal on plugin reload — the GMCP mirror retains
# the last frame, and gmcp.get exact-path-matches against the manifest
# globs whereas gmcp.on prefix-matches.
#
# This plugin used to read vitals' var/event mirror to avoid declaring
# gmcp_access; that coupling broke on isolated reloads and load-order
# races. Direct subscription is two extra lines for permanent
# independence.
gmcp_access = ["char.info", "char.info.*"]

[worlds]
match = ["discworld.starturtle.net:*"]

[gmcp]
advertise = ["char.info"]

[panels.group]
title              = "Group"
entry              = "ui/group.html"
default_dock       = "right"
default_size       = { width = 240, height = 320 }

[settings.invite_sound]
type = "bool"
default = false
label = "Group-invite sound"
description = "Play the mallard:chime-high chime when another player invites you to join their group."
