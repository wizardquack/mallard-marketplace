id = "net.discworld.beings-discworld-blorp-recorder"
name = "Being's Discworld Blorp Recorder"
description = "Record identified items as a deduplicated list of Discworld blorp places, with instant search and Go/See buttons."
version = "1.0.5"
language = "lua"
entry = "src/main.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.27.0"
authors = ["duzchip"]
license = "MIT"

[worlds]
match = ["discworld.starturtle.net:*"]

[permissions]
sends = true
notifications = false
keychain = false
network = []

[panels.beings-discworld-blorp-recorder]
title = "Being's Discworld Blorp Recorder"
kind = "custom"
entry = "ui/panel.html"
default_dock = "right"
default_size = { width = 360, height = 480 }
default_dock_after = "output"
popout_allowed = true
