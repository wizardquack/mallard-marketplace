id = "com.github.rhwone.greg-tracker"
name = "Bosse's Discworld Greg Tracker"
version = "0.2.1"
language = "lua"
entry = "src/init.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.24.0"
description = "Tracks each skeleton warrior raised with Grisald's Reanimated Guardian on Discworld MUD, from birth to death, and builds lifetime statistics grouped by cause of death and fierceness."
authors = ["rhwone"]
license = "MIT"
homepage = "https://github.com/rhwone/mallard-greg-tracker"

[worlds]
match = ["discworld.starturtle.net:*", "*.starturtle.net:*"]

[permissions]
# Runs are kept per character, so the same account raising on two characters
# doesn't average one skeleton's lifetime against the other's. "char.info" for
# the gmcp.on subscription that resolves the name once it's known (0.1.6);
# the leaf "char.info.name" for the gmcp.get seed at boot.
gmcp_access = ["char.info", "char.info.name"]

[gmcp]
advertise = ["char.info 1"]

[panels.greg]
title = "Greg"
kind  = "custom"
entry = "ui/greg.html"

[settings.bare_alias]
type = "bool"
default = true
label = "Accept 'greg ...' typed without the command prefix"
