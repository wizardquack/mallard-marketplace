id = "com.github.rhwone.vaulttracker"
name = "Bosse's Discworld Vault Tracker"
version = "0.2.3"
language = "lua"
entry = "src/init.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.24.0"
description = "Remembers what is inside your vaults on Discworld MUD, one per room, and keeps a searchable list of every item you have stashed."
authors = ["rhwone"]
license = "MIT"
homepage = "https://github.com/rhwone/mallard-discworld-vaulttracker"

[worlds]
match = ["discworld.starturtle.net:*", "*.starturtle.net:*"]

[permissions]
# "room.info" for the gmcp.on subscription, and the leaf "room.info.identifier"
# for the gmcp.get, which is checked against the full key it is given rather than
# against the package prefix. A parent entry only extends to its children when
# globbing them ("room.info.*"), which this does not need.
# "char.info.name" keys storage per character (0.2.0); "char.info" (0.2.1) is
# the gmcp.on subscription that resolves it once, rather than re-querying
# gmcp.get on every save - see src/init.lua.
gmcp_access = ["room.info", "room.info.identifier", "char.info", "char.info.name"]

[panels.vault]
title = "Vaults"
kind = "custom"
entry = "ui/vault.html"

[settings.bare_alias]
type = "bool"
default = true
label = "Accept 'vault ...' typed without the command prefix"

[settings.stale_days]
type = "number"
default = 14
min = 0
max = 365
label = "Remind me when a vault's record is this many days old"
description = "On walking into a registered vault room whose contents were last recorded longer ago than this, print a one-line reminder to look in the container. Set to 0 to turn the reminder off."

[gmcp]
# GMCP advertises packages as "Package Version" — the version is required and
# must be a positive integer. Without it Mallard 0.25.0+ warns at load and
# sends "room.info 1" on our behalf, so this is what it was always doing.
advertise = ["room.info 1", "char.info 1"]
