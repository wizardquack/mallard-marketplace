id = "net.mallard.discworld-magic"
name = "Discworld Magic"
version = "0.10.0"
description = "Magic highlights and inline annotations in game output, as well as some helper commands."
language = "lua"
entry = "src/main.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.9.0"
authors = ["Wizard Quack"]
license = "MIT"

[permissions]
notifications = true
sends = true
# char.info: subscribe to detect character switches (`su`) so the shield
# modules can drop the previous character's stale self-shield state. Magic
# owns shield detection, so it's the source of truth for that reset.
# "char.info.*" backs gmcp.get() at load (self-heal on plugin reload —
# gmcp.on doesn't replay past frames). See src/char_switch.lua.
gmcp_access = ["char.info", "char.info.*"]

[gmcp]
advertise = ["char.info"]

[worlds]
match = ["discworld.starturtle.net:*"]

[settings.eff_drop_notify]
type = "bool"
default = true
label = "Floater-down system notification"
description = "Show a system notification when your Endorphin's Floating Friend (EFF) drops."

[settings.eff_drop_sound]
type = "bool"
default = false
label = "Floater-down sound"
description = "Play the mallard:ding-ding-low chime when your EFF drops."

[settings.jpct_create_sound]
type = "bool"
default = false
label = "Portal-created sound"
description = "Play the mallard:ding-ding-high chime when a JPCT portal solidifies."
