id = "net.discworld.bproute"
name = "Being's Discworld BP Route"
description = "Track Bes Pelargic NPC kills and suggest routes through high-value rooms using a persistent SQLite database."
version = "1.0.2"
language = "lua"
entry = "src/main.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.27.0"
authors = ["duzchip"]
license = "MIT"

[worlds]
match = [
  "discworld.starturtle.net:23",
]

[permissions]
sends = false
gmcp_access = ["Room.Info"]
notifications = false
keychain = false
network = []
database = true

[gmcp]
advertise = ["room.info 1"]

[settings.min_kills]
type = "number"
default = 3
min = 1
max = 20
label = "Minimum kills for route"
description = "Minimum NPC kills in a room before it's included in the route."
