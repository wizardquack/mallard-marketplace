id = "net.discworld.beings-discworld-spell-library"
name = "Being's Discworld Spell Library"
description = "An offline A–Z spell library for Discworld wizards and witches, with abbreviations, spell types, components, skills, learning sources, and full wiki details."
version = "1.0.0"
language = "lua"
entry = "src/main.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.27.0"
authors = ["duzchip"]
license = "MIT"

[worlds]
match = ["discworld.starturtle.net:*"]

[permissions]
sends = false
gmcp_access = []
notifications = false
keychain = false
network = []

[panels.beings-discworld-spell-library]
title = "Being's Discworld Spell Library"
kind = "custom"
entry = "ui/panel.html"
default_dock = "right"
default_size = { width = 420, height = 560 }
default_dock_after = "output"
popout_allowed = true
