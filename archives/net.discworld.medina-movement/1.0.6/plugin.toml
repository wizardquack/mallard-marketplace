id = "net.discworld.medina-movement"
name = "Being's Discworld Medina Mover"
description = "Map and navigate the Red Triangle Medina maze, track occupants, and exchange map data with other players."
version = "1.0.6"
language = "lua"
entry = "src/main.lua"
mallard_api_version = "1.0"
minimum_app_version = "0.27.0"
authors = ["duzchip"]
license = "MIT"

[worlds]
match = [
  "discworld.starturtle.net:43",
  "discworld.starturtle.net:4242",
  "discworld.starturtle.net:4245",
]

[permissions]
sends = true
gmcp_access = ["Room.Info"]
notifications = false
keychain = false
network = []

[panels.map]
title = "Medina Map"
kind = "custom"
entry = "ui/map.html"
default_dock = "right"
default_size = { width = 300, height = 300 }
default_dock_after = "output"
popout_allowed = true

[gmcp]
advertise = ["room.info 1"]

[settings.arrow_set]
type = "enum"
default = "default"
label = "Arrow set"
choices = [
  { value = "default", label = "Default" },
  { value = "rainbow", label = "Rainbow" },
]
